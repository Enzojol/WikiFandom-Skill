  - id: bn-004
    kind: compare
    q: "In Battle Nations, how much gold does it cost to train a Sniper and a Riot Trooper? Which is more expensive?"
    answer: "Sniper 8,000 gold, Riot Trooper 2,250 gold: the Sniper is more expensive"
    source: https://battlenations.fandom.com/wiki/Sniper
  - id: bn-005
    kind: aggregate
    q: "In Battle Nations, which 5 player units have the highest HP at their maximum rank? Give the HP values."
    answer: "Portable Wall 900, Tamed Mammoth Matriarch 825, Specimen i02 \"Apex Mauler\" 780, Monster Grouper 775, Battleship Mammoth-Class 740"
    notes: "Player units = units with a unit profile and rank table. Order and values matter; at least 4 of 5 right with values = partial. The question is ambiguous: an answer that explicitly excludes defensive structures (walls, buoys) and units with no building requirement, names them with their HP, and then ranks the rest is also correct (Monster Grouper 775, Battleship Mammoth-Class 740, Bigfoot 720, Bigfoot Shaman 720, Power Boat 705). Added after the first run."
    source: https://battlenations.fandom.com/wiki/Portable_Wall
  - id: bn-006
    kind: aggregate
    q: "In Battle Nations, how many units require the Barracks (any level) to be trained, according to the wiki?"
    answer: "61"
    notes: "Counted from each unit page's 'building required' field. 55 to 67 = partial; otherwise wrong."
    source: https://battlenations.fandom.com/wiki/Barracks
