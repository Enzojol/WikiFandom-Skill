  - id: bn-001
    kind: lookup
    q: "In Battle Nations, what is the Riot Trooper's HP at each rank?"
    answer: "70, 85, 105, 120, 140, 155 (ranks 1 to 6)"
    notes: "The page contradicts itself: the rank table labels 70-155 as HP, but the profile box shows HP 90 / Armor 155 and a patch note calls 70-155 armor. Also correct: 60, 65, 70, 80, 85, 90 when the answer explicitly points out this inconsistency. Added after the first run."
    source: https://battlenations.fandom.com/wiki/Riot_Trooper
  - id: bn-002
    kind: lookup
    q: "In Battle Nations, which building, at which level, is required to train the Sniper?"
    answer: "Barracks level 5"
    source: https://battlenations.fandom.com/wiki/Sniper
  - id: bn-003
